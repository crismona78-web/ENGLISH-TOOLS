<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}*{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Word Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@500;600;700&display=swap">
<style>
/* Layout: one centred column. Home = mode switch + unit grid. Game = two columns of tiles (English | Español) under a sticky score bar. */
:root{
  --bg:#E9E7FF; --surface:#FFFFFF; --ink:#17143A; --muted:#5B5887; --line:#17143A;
  --accent:#5B3DF5; --accent-ink:#FFFFFF; --es:#FFE35C; --es-ink:#17143A;
  --good:#12A66A; --bad:#F2415F; --pastel-ink:#17143A;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14112E; --surface:#25214F; --ink:#F2F0FF; --muted:#A9A5D6; --line:#080618;
    --accent:#8B73FF; --accent-ink:#0F0B2E; --es:#F5D547; --es-ink:#17143A;
    --good:#2BD08C; --bad:#FF6B86; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14112E; --surface:#25214F; --ink:#F2F0FF; --muted:#A9A5D6; --line:#080618;
  --accent:#8B73FF; --accent-ink:#0F0B2E; --es:#F5D547; --es-ink:#17143A;
  --good:#2BD08C; --bad:#FF6B86; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:760px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2{font-family:var(--display);font-weight:800;text-wrap:balance;margin:0;letter-spacing:-.02em}

/* Home */
.hero{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.hero h1{font-size:clamp(2.6rem,9vw,4.2rem);line-height:.95}
.hero p{margin:10px 0 0;color:var(--muted);font-weight:600;max-width:34ch}
.demo{position:relative;width:190px;height:96px;flex:none}
.demo .tile{position:absolute;width:140px;cursor:default;pointer-events:none}
.demo .a{left:0;top:0;transform:rotate(-5deg)}
.demo .b{right:0;bottom:0;transform:rotate(4deg)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;background:var(--surface);border:2.5px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);margin-bottom:18px}
.seg button{border:0;background:transparent;border-radius:12px;padding:12px 10px;font-weight:700;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button small{font-weight:600;color:var(--muted);font-size:.78rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.unit{position:relative;text-align:left;background:hsl(var(--h) 90% 76%);color:var(--pastel-ink);border:2.5px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);padding:12px 14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:transform .12s,box-shadow .12s,opacity .15s}
.unit:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--line)}
.unit .num{font:800 .8rem var(--display);letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.unit .name{font:700 1.08rem/1.15 var(--display)}
.unit .count{font-size:.82rem;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}
.unit .tick{position:absolute;right:10px;top:10px;width:24px;height:24px;border-radius:50%;border:2.5px solid var(--line);background:var(--surface);display:none;place-items:center;font-weight:800;font-size:.85rem;color:var(--ink)}
.mixmode .unit .tick{display:grid}
.mixmode .unit[aria-pressed="true"] .tick{background:var(--ink);color:var(--surface)}
.mixmode .unit[aria-pressed="false"]{opacity:.45;box-shadow:0 2px 0 var(--line)}
.mixbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.mixbar .spacer{flex:1}
.btn{border:2.5px solid var(--line);border-radius:14px;background:var(--surface);padding:11px 16px;font-weight:700;box-shadow:0 4px 0 var(--line);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:8px 4px;color:var(--ink)}

/* Game */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 12px;margin-bottom:6px}
.barrow{display:flex;align-items:center;gap:10px}
.barrow .title{font:800 1.05rem var(--display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.stat{font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface);border:2.5px solid var(--line);border-radius:12px;padding:5px 10px;font-size:.92rem;white-space:nowrap}
.stat.bad b{color:var(--bad)}
.progress{height:14px;border:2.5px solid var(--line);border-radius:99px;background:var(--surface);margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--good);border-radius:99px;transition:width .3s ease}
.hint{color:var(--muted);font-weight:600;font-size:.88rem;margin:8px 2px 12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.colhead{font:800 .78rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-inline:4px}
.tile{font:600 15px/1.2 var(--body);text-align:left;min-height:50px;padding:11px 12px;border:2.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);overflow-wrap:anywhere;hyphens:auto;display:flex;align-items:center;transition:transform .12s,box-shadow .12s,background .12s}
.tile.es{background:var(--es);color:var(--es-ink)}
@media (hover:hover){.tile:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--line)}}
.tile.sel{background:var(--accent);color:var(--accent-ink);transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.tile.wrong{background:var(--bad);color:#fff;animation:shake .4s}
.tile.ok{background:var(--good);color:#fff}
.tile.gone{pointer-events:none;animation:pop .3s ease forwards}
@keyframes shake{0%,100%{translate:0}20%{translate:-6px}40%{translate:6px}60%{translate:-4px}80%{translate:3px}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.07)}100%{transform:scale(.5);opacity:0}}

/* End */
.end{text-align:center;padding-top:24px}
.end h2{font-size:clamp(2.2rem,8vw,3.6rem);line-height:1}
.end p{color:var(--muted);font-weight:600;margin:10px 0 22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.stats div{background:var(--surface);border:2.5px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);padding:14px 6px}
.stats b{display:block;font:800 1.9rem var(--display);font-variant-numeric:tabular-nums}
.stats span{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* Tabs + exam skill cards */
.tabs{display:flex;gap:6px 20px;flex-wrap:wrap;margin-bottom:18px;border-bottom:3px solid var(--line)}
.tabs button{border:0;background:none;font:800 1.05rem var(--display);color:var(--muted);padding:8px 2px 10px;margin-bottom:-3px;border-bottom:6px solid transparent;letter-spacing:-.01em}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.skill{background:hsl(var(--h) 90% 76%);color:var(--pastel-ink);border:2.5px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.skill h3{font:800 1.35rem/1.1 var(--display);margin:0;letter-spacing:-.02em}
.skill p{margin:0;font-size:.92rem;font-weight:600;opacity:.85}
.skill .count{font-size:.8rem;font-weight:700;opacity:.75}
.skill .modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.mini{border:2.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:8px 12px;font-weight:700;font-size:.92rem;box-shadow:0 3px 0 var(--line);transition:transform .1s,box-shadow .1s}
.mini:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

/* Gap Rush */
#rFill{background:var(--accent);transition:width .2s linear}
#rFill.low{background:var(--bad)}
.q{background:var(--surface);border:2.5px solid var(--line);border-radius:20px;box-shadow:0 5px 0 var(--line);padding:22px 18px;margin-bottom:16px;min-height:116px;display:flex;align-items:center}
.q p{margin:0;font:700 clamp(1.15rem,4.6vw,1.55rem)/1.45 var(--display);overflow-wrap:anywhere}
.gap{display:inline-block;min-width:3.4em;margin-inline:.15em;border-bottom:4px solid var(--accent);color:var(--accent);text-align:center;padding-inline:.15em}
.gap.good{color:var(--good);border-color:var(--good)}
.gap.bad{color:var(--bad);border-color:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font:700 1.02rem/1.2 var(--body);text-align:center;min-height:62px;padding:12px 10px;border:2.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);overflow-wrap:anywhere;display:flex;align-items:center;justify-content:center;transition:transform .12s,box-shadow .12s,background .12s}
@media (hover:hover){.opt:not([disabled]):hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--line)}}
.opt[disabled]{cursor:default}
.opt.ok{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad);color:#fff;animation:shake .4s}
.opt.dim{opacity:.5}
.fb{min-height:3em;margin:14px 2px 0;font-weight:600;color:var(--muted);text-align:center;overflow-wrap:anywhere}
.fb b{color:var(--ink)}
/* Recap list on the end screen */
.recap{text-align:left;margin:0 0 26px;display:flex;flex-direction:column;gap:10px}
.recap[hidden]{display:none}
.recap h3{font:800 1.15rem var(--display);margin:4px 2px 2px;text-align:center}
.ri{background:var(--surface);border:2.5px solid var(--line);border-radius:14px;padding:11px 14px;box-shadow:0 3px 0 var(--line);min-width:0}
.ri .w{font:800 1.02rem var(--display);overflow-wrap:anywhere}
.ri .w em{font:600 .92rem var(--body);font-style:normal;color:var(--muted)}
.ri .x{margin:4px 0 0;font-weight:500;overflow-wrap:anywhere}
.ri .x mark{background:var(--es);color:var(--es-ink);padding:0 .22em;border-radius:5px;font-weight:700}
.ri .e{margin:5px 0 0;font-size:.88rem;font-weight:600;color:var(--muted);overflow-wrap:anywhere}
.ri .mk{float:right;margin-left:10px;font-weight:800;font-size:1.1rem}
.ri.good .mk{color:var(--good)}
.ri.bad .mk{color:var(--bad)}
@media (max-width:420px){
  .tile{font-size:14px;padding:10px 9px}
  .cols{gap:8px}
  .stat{padding:4px 8px;font-size:.84rem}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

</head>
<body>
<div class="wrap">

  <section id="home">
    <div class="hero">
      <div>
        <h1>Word Match</h1>
        <p>Pair every English word with its Spanish translation. 10 pairs per round, then a recap with each word in a sentence.</p>
      </div>
      <div class="demo" aria-hidden="true">
        <div class="tile a">gut feeling</div>
        <div class="tile es b">intuición</div>
      </div>
    </div>

    <div class="tabs" role="group" aria-label="Section">
      <button id="tabUnits" aria-pressed="true">Vocabulary units</button>
      <button id="tabSkills" aria-pressed="false">Exam skills</button>
      <button id="tabGram" aria-pressed="false">Grammar</button>
    </div>

    <div id="pUnits">
    <div class="seg" role="group" aria-label="Game mode">
      <button id="modeOne" aria-pressed="true">One unit<small>Tap a unit to start</small></button>
      <button id="modeMix" aria-pressed="false">Mix units<small>Choose which ones to blend</small></button>
    </div>

    <div id="units" class="grid"></div>

    <div id="mixbar" class="mixbar" hidden>
      <button class="link" id="allBtn">Select all</button>
      <button class="link" id="noneBtn">Clear</button>
      <span class="spacer"></span>
      <button class="btn primary" id="startMix">Start mix</button>
    </div>
    </div>

    <div id="pSkills" hidden>
      <div class="skills" id="skills"></div>
    </div>

    <div id="pGram" hidden>
      <div class="skills" id="grammar"></div>
    </div>
  </section>

  <section id="game" hidden>
    <div class="bar">
      <div class="barrow">
        <button class="btn" id="backBtn" aria-label="Back to units" style="padding:6px 12px">&larr;</button>
        <div class="title" id="gTitle"></div>
        <div class="stat" id="gTime">0:00</div>
        <div class="stat bad" id="gMiss">Misses <b>0</b></div>
      </div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0" id="gProg"><i id="gFill"></i></div>
    </div>
    <p class="hint"><span id="gLeft">25</span> pairs left. Tap a word, then its translation. Either column first.</p>
    <div class="cols">
      <div class="col" id="colEn"><div class="colhead">English</div></div>
      <div class="col" id="colEs"><div class="colhead">Español</div></div>
    </div>
  </section>

  <section id="rush" hidden>
    <div class="bar">
      <div class="barrow">
        <button class="btn" id="rBack" aria-label="Back to menu" style="padding:6px 12px">&larr;</button>
        <div class="title" id="rTitle"></div>
        <div class="stat" id="rTime">1/10</div>
        <div class="stat" id="rScore">✓ 0</div>
      </div>
      <div class="progress"><i id="rFill" style="width:0"></i></div>
    </div>
    <p class="hint" id="rHint"></p>
    <div class="q"><p id="rQ"></p></div>
    <div class="opts" id="rOpts"></div>
    <p class="fb" id="rFb" aria-live="polite"></p>
    <div class="actions"><button class="btn primary" id="rNext" hidden>Next</button></div>
  </section>

  <section id="end" class="end" hidden>
    <h2 id="eTitle"></h2>
    <p id="eSub"></p>
    <div class="stats" id="eStats"></div>
    <div class="recap" id="eRecap" hidden></div>
    <div class="actions">
      <button class="btn primary" id="againBtn">Next 25</button>
      <button class="btn" id="changeBtn">Back to menu</button>
    </div>
  </section>

</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>

var ROUND = 10;
function parse(txt, extra){
  return (txt || "").trim().split("\n").filter(Boolean).map(function(l){
    var i = l.indexOf("|");
    return {en:l.slice(0,i).trim(), es:l.slice(i+1).trim(), x:extra};
  });
}
var UNITS = RAW.map(function(u){
  var seen = {};
  function ok(w){
    var k = w.en.toLowerCase();
    if (k === w.es.toLowerCase() || seen[k]) return false;
    seen[k] = 1; return true;
  }
  var main = parse(u.d, false).filter(ok);
  var extra = parse(EXTRA[u.n], true).filter(ok);
  var sm = SENT[u.n] || {};
  main.concat(extra).forEach(function(w){ w.s = sm[w.en.toLowerCase()]; });
  return {n:u.n, t:u.t, h:u.h, main:main, extra:extra, words:main.concat(extra)};
});

var $ = function(s){ return document.querySelector(s); };
var screens = {home:$("#home"), game:$("#game"), rush:$("#rush"), end:$("#end")};
function show(name){
  for (var k in screens) screens[k].hidden = (k !== name);
  window.scrollTo(0,0);
}
function shuffle(a){
  a = a.slice();
  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function fmt(s){ var m=Math.floor(s/60), r=s%60; return m+":"+(r<10?"0":"")+r; }

/* ---------- Home ---------- */
var mode = "one";
var picked = {};
UNITS.forEach(function(u){ picked[u.n] = true; });

var unitsEl = $("#units");
UNITS.forEach(function(u){
  var b = document.createElement("button");
  b.className = "unit";
  b.style.setProperty("--h", u.h);
  b.dataset.n = u.n;
  b.innerHTML = '<span class="tick" aria-hidden="true">&#10003;</span><span class="num">Unit '+u.n+'</span><span class="name">'+u.t.replace(/&/g,"&amp;")+'</span><span class="count">'+u.main.length+' words'+(u.extra.length ? ' + '+u.extra.length+' extra' : '')+'</span>';
  b.addEventListener("click", function(){
    if (mode === "one") { start([u]); }
    else { picked[u.n] = !picked[u.n]; renderHome(); }
  });
  unitsEl.appendChild(b);
});

function renderHome(){
  var one = mode === "one";
  $("#modeOne").setAttribute("aria-pressed", one);
  $("#modeMix").setAttribute("aria-pressed", !one);
  $("#home").classList.toggle("mixmode", !one);
  $("#mixbar").hidden = one;
  var total = 0;
  Array.prototype.forEach.call(unitsEl.children, function(b){
    var n = +b.dataset.n;
    if (one) b.removeAttribute("aria-pressed");
    else b.setAttribute("aria-pressed", !!picked[n]);
    if (picked[n]) total += UNITS[n-1].words.length;
  });
  var cnt = UNITS.filter(function(u){ return picked[u.n]; }).length;
  var sm = $("#startMix");
  sm.disabled = cnt === 0;
  sm.textContent = cnt === 0 ? "Pick at least one unit" : "Start mix · " + cnt + (cnt===1?" unit":" units") + " · " + total + " words";
}
$("#modeOne").addEventListener("click", function(){ mode="one"; renderHome(); });
$("#modeMix").addEventListener("click", function(){ mode="mix"; renderHome(); });
$("#allBtn").addEventListener("click", function(){ UNITS.forEach(function(u){ picked[u.n]=true; }); renderHome(); });
$("#noneBtn").addEventListener("click", function(){ UNITS.forEach(function(u){ picked[u.n]=false; }); renderHome(); });
$("#startMix").addEventListener("click", function(){
  var sel = UNITS.filter(function(u){ return picked[u.n]; });
  if (sel.length) start(sel);
});

/* ---------- Game ---------- */
var cur = null;           // current selection of units
var seenByPool = loadSeen();   // pool key -> {english: true}, remembered between visits
function loadSeen(){
  try { return JSON.parse(localStorage.getItem("wm-seen-v2") || "{}") || {}; } catch(e){ return {}; }
}
function saveSeen(){
  try { localStorage.setItem("wm-seen-v2", JSON.stringify(seenByPool)); } catch(e){}
}
var G = null;             // round state

function buildRound(units){
  var key = units.map(function(u){ return u.n; }).join(",");
  var pool = [];
  units.forEach(function(u){ pool = pool.concat(u.words); });
  var seen = seenByPool[key] || (seenByPool[key] = {});
  var unseen = pool.filter(function(w){ return !seen[w.en]; });
  if (!unseen.length){ seen = seenByPool[key] = {}; unseen = pool.slice(); }   // everything played: start over
  var order = shuffle(unseen.filter(function(w){ return !w.x; }))              // official words first
    .concat(shuffle(unseen.filter(function(w){ return w.x; })))                // then extra words on the topic
    .concat(shuffle(pool.filter(function(w){ return seen[w.en]; })));          // recycle only if still short
  var usedEn = {}, usedEs = {}, items = [];
  order.forEach(function(w){
    if (items.length >= ROUND) return;
    var e = w.en.toLowerCase(), s = w.es.toLowerCase();
    if (usedEn[e] || usedEs[s]) return;     // no ambiguous pairs inside one round
    usedEn[e] = usedEs[s] = true;
    items.push({id: items.length, en: w.en, es: w.es, s: w.s, h: w.h});
  });
  items.forEach(function(it){ seen[it.en] = true; });
  saveSeen();
  return items;
}

function start(units){
  cur = units;
  var items = buildRound(units);
  G = {items:items, left:items.length, miss:0, t0:Date.now(), sel:{en:null, es:null}, lock:false, timer:null};
  $("#gTitle").textContent = units.length === 1 ? (units[0].label || "Unit " + units[0].n + " · " + units[0].t) : "Mix · " + units.length + " units";
  $("#gProg").setAttribute("aria-valuemax", items.length);
  var ce = $("#colEn"), cs = $("#colEs");
  ce.innerHTML = '<div class="colhead">English</div>';
  cs.innerHTML = '<div class="colhead">Español</div>';
  shuffle(items).forEach(function(it){ ce.appendChild(tile(it, "en")); });
  shuffle(items).forEach(function(it){ cs.appendChild(tile(it, "es")); });
  updateBar();
  show("game");
  clearInterval(G.timer);
  G.timer = setInterval(function(){ $("#gTime").textContent = fmt(Math.floor((Date.now()-G.t0)/1000)); }, 250);
}
function tile(it, side){
  var b = document.createElement("button");
  b.className = "tile" + (side === "es" ? " es" : "");
  b.textContent = side === "en" ? it.en : it.es;
  b.dataset.id = it.id; b.dataset.side = side;
  b.addEventListener("click", function(){ pick(b); });
  return b;
}
function updateBar(){
  var total = G.items.length, done = total - G.left;
  $("#gFill").style.width = (done/total*100) + "%";
  $("#gProg").setAttribute("aria-valuenow", done);
  $("#gLeft").textContent = G.left;
  $("#gMiss").innerHTML = "Misses <b>" + G.miss + "</b>";
}
function pick(b){
  if (G.lock || b.classList.contains("gone")) return;
  var side = b.dataset.side;
  if (G.sel[side] === b){ b.classList.remove("sel"); G.sel[side] = null; return; }
  if (G.sel[side]) G.sel[side].classList.remove("sel");
  G.sel[side] = b; b.classList.add("sel");
  if (G.sel.en && G.sel.es) check();
}
function check(){
  var a = G.sel.en, b = G.sel.es;
  G.sel = {en:null, es:null};
  G.lock = true;
  if (a.dataset.id === b.dataset.id){
    a.classList.remove("sel"); b.classList.remove("sel");
    a.classList.add("ok"); b.classList.add("ok");
    setTimeout(function(){
      a.classList.add("gone"); b.classList.add("gone");
      G.left--; updateBar();
      G.lock = false;
      setTimeout(function(){
        a.remove(); b.remove();
        if (G.left === 0) finish();
      }, 280);
    }, 160);
  } else {
    G.miss++; updateBar();
    a.classList.remove("sel"); b.classList.remove("sel");
    a.classList.add("wrong"); b.classList.add("wrong");
    setTimeout(function(){
      a.classList.remove("wrong"); b.classList.remove("wrong");
      G.lock = false;
    }, 420);
  }
}
$("#backBtn").addEventListener("click", function(){
  if (G) clearInterval(G.timer);
  show("home");
});

/* ---------- End ---------- */
function finish(){
  clearInterval(G.timer);
  var secs = Math.floor((Date.now()-G.t0)/1000);
  var n = G.items.length;
  var acc = Math.round(n / (n + G.miss) * 100);
  var title, sub;
  if (G.miss === 0){ title = "Flawless."; sub = "Not a single slip. Every pair matched first time."; }
  else if (acc >= 85){ title = "Sharp work."; sub = "Just a couple of wobbles. Another round will lock them in."; }
  else if (acc >= 65){ title = "Getting there."; sub = "Plenty of pairs landed. The next 25 will bring new words."; }
  else { title = "Good practice."; sub = "Tricky list. Play another round and the words will start to stick."; }
  showEnd(title, sub, [[fmt(secs),"Time"],[G.miss,"Misses"],[acc+"%","Accuracy"]], "Next 10", function(){ start(cur); },
    "Words in context", G.items.map(function(it){ return {t:it.en, sub:it.es, s:it.s, hl:it.h || it.en}; }));
  if (acc >= 65) confetti();
}
var againFn = null;
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function hl(sentence, phrase){
  if (!sentence) return "";
  var low = sentence.toLowerCase(), i = -1, p = phrase || "";
  if (p) i = low.indexOf(p.toLowerCase());
  if (i < 0 && p){ p = p.replace(/\s*\([^)]*\)/g, "").trim(); if (p) i = low.indexOf(p.toLowerCase()); }
  if (i < 0) return esc(sentence);
  return esc(sentence.slice(0,i)) + "<mark>" + esc(sentence.slice(i, i+p.length)) + "</mark>" + esc(sentence.slice(i+p.length));
}
function renderRecap(title, rows){
  var box = $("#eRecap");
  if (!rows || !rows.length){ box.innerHTML = ""; box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = "<h3>" + esc(title) + "</h3>" + rows.map(function(r){
    return '<div class="ri' + (r.ok === true ? " good" : r.ok === false ? " bad" : "") + '">' +
      (r.ok === undefined ? "" : '<span class="mk">' + (r.ok ? "&#10003;" : "&#10007;") + "</span>") +
      (r.t ? '<div class="w">' + esc(r.t) + (r.sub ? ' <em>&middot; ' + esc(r.sub) + "</em>" : "") + "</div>" : "") +
      (r.s ? '<p class="x">' + hl(r.s, r.hl) + "</p>" : "") +
      (r.note ? '<p class="e">' + esc(r.note) + "</p>" : "") + "</div>";
  }).join("");
}
function showEnd(title, sub, stats, againLabel, fn, recapTitle, rows){
  $("#eTitle").textContent = title;
  $("#eSub").textContent = sub;
  $("#eStats").innerHTML = stats.map(function(s){ return "<div><b>"+s[0]+"</b><span>"+s[1]+"</span></div>"; }).join("");
  $("#againBtn").textContent = againLabel;
  againFn = fn;
  renderRecap(recapTitle, rows);
  show("end");
}
$("#againBtn").addEventListener("click", function(){ if (againFn) againFn(); });
$("#changeBtn").addEventListener("click", function(){ show("home"); });

function confetti(){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var box = $("#confetti"), cols = ["#5B3DF5","#FFE35C","#F2415F","#12A66A","#FF8A3D"];
  box.innerHTML = "";
  for (var i=0;i<44;i++){
    var p = document.createElement("i");
    p.style.left = Math.random()*100 + "vw";
    p.style.background = cols[i % cols.length];
    p.style.animationDuration = (1.8 + Math.random()*1.6) + "s";
    p.style.animationDelay = (Math.random()*0.5) + "s";
    box.appendChild(p);
  }
  setTimeout(function(){ box.innerHTML = ""; }, 4200);
}

function parseQ(txt, kind){
  return txt.trim().split("\n").filter(Boolean).map(function(l, i){
    var f = l.split("|");
    if (kind === "pp") return {id:kind+i, s:f[0].trim(), a:f[1].trim(), en:f[1].trim(), es:""};
    return {id:kind+i, en:f[0].trim(), es:f[1].trim(), s:f[2].trim(), a:(f[3] || f[0]).trim()};
  });
}

addGram("used", "Used to, be used to, get used to", 150, "Past habits, being accustomed to something, and getting accustomed to it.", "When I was a child, I ____ play in the street every afternoon.|used to|am used to;get used to;was using to|Used to + infinitive describes a habit in the past.\nDid you ____ live in London?|use to|used to;get used to;be used to|After did/didn't, the form is use to (no -d).\nI didn't ____ like coffee, but now I love it.|use to|used to;get used to;be used to|Negative with didn't: use to + infinitive.\nShe isn't ____ the cold weather yet.|used to|use to;used to be;getting used|Be used to + noun/-ing means to be accustomed to something.\nIt took me a few months to ____ living in the city.|get used to|used to;be use to;get use to|Get used to + -ing is the process of becoming accustomed.\nI'm not used to ____ so early.|getting up|get up;got up;to get up|After be used to we use a noun or the -ing form.\nHe used to ____ a lot of sport when he was younger.|do|doing;did;to do|Used to is followed by the base form of the verb.\nMy grandfather ____ the guitar, but now his fingers hurt.|used to play|is used to play;is used to playing;used to playing|Used to + infinitive for a past habit that no longer exists.\nYou'll soon ____ the new schedule.|get used to|use to;used to;be used to|Soon + get used to: you will become accustomed to it.\nWe're ____ working long hours, so it doesn't bother us.|used to|use to;used;getting use|Be used to + -ing: we are accustomed to it.\nThere ____ be a cinema here, but it closed years ago.|used to|is used to;was used to;use to|Used to also describes past states, not only habits.\nAre you ____ driving on the left?|used to|use to;used;get used to|Be used to + -ing, used in a question.\nI can't ____ the noise from the street.|get used to|be used to;used to;use to|Can't get used to + noun: I can't become accustomed to it.\nWhen we lived in Italy, we ____ eat pasta twice a week.|used to|were used to;got used to;use to|A past habit: used to + infinitive.\nShe ____ speak much English when she arrived, but she's fluent now.|didn't use to|didn't used to;wasn't used to;doesn't use to|Negative past habit: didn't use to + infinitive.\nAfter a week, the children had got ____ the new school.|used to|use to;used;get used|Get used to + noun: become accustomed to something.");
addGram("wish", "I wish and if only", 280, "Regrets, unreal situations and things that annoy you.", "I wish I ____ more free time.|had|have;would have;has|Wish + past simple talks about an unreal present situation.\nIf only I ____ the answer, I would tell you.|knew|know;had known;would know|If only + past simple: a present situation we would like to be different.\nI wish I ____ to the party last night.|had gone|went;would go;have gone|Wish + past perfect expresses a regret about the past.\nI wish it ____ raining; I want to go out.|would stop|stopped;had stopped;stops|Wish + would is used for things we want to change or that annoy us.\nIf only I ____ taller!|were|am;would be;had been|In wishes about the present, were is correct for all persons.\nShe wishes she ____ a car, but she can't afford one.|had|has;would have;has had|Wish + past simple: she doesn't have a car now.\nI wish I ____ to the doctor earlier; now I feel worse.|had gone|went;would go;have gone|Past regret: wish + past perfect.\nIf only he ____ listen to me!|would|will;did;had|If only + would: we are annoyed because he doesn't listen.\nI wish I ____ speak Chinese.|could|can;would;did|Wish + could for an ability we don't have.\nThey wish they ____ the match yesterday.|had won|won;would win;have won|A regret about the past needs the past perfect.\nI wish it ____ summer all year.|were|is;would be;had been|Unreal present: wish + past simple (were).\nIf only I ____ so rude to her last night!|hadn't been|wasn't;weren't;wouldn't be|If only + past perfect: regret about something we did.\nI wish I ____ in a bigger flat.|lived|live;would live;had lived|Wish + past simple for a present situation we don't like.\nIf only we ____ more time!|had|have;would have;has|If only + past simple: we don't have more time now.\nI wish I ____ so much last night; I feel awful.|hadn't eaten|didn't eat;wouldn't eat;haven't eaten|Regret about the past: wish + past perfect.\nI wish people ____ their litter on the beach.|wouldn't leave|didn't leave;don't leave;hadn't left|Wish + would for annoying habits of other people.");
addGram("passive", "Passive voice", 10, "Choose the right passive form in every tense.", "The Mona Lisa ____ by Leonardo da Vinci.|was painted|painted;is painted;has painted|Past simple passive: was/were + past participle.\nEnglish ____ all over the world.|is spoken|speaks;is speaking;spoken|Present simple passive: am/is/are + past participle.\nThe bridge ____ at the moment.|is being repaired|is repaired;repairs;has repaired|Present continuous passive: am/is/are being + past participle.\nMy car ____ yesterday.|was stolen|stole;has stolen;was stealing|We use the passive when the action matters more than the thief.\nThe report ____ by Friday.|will be finished|will finish;finished;is finishing|Future passive: will be + past participle.\nThe windows ____ twice a month.|are cleaned|clean;are cleaning;cleaned|A routine in the passive: are + past participle.\nThe new library ____ by the mayor next year.|will be opened|will open;opens;is opening|With by + agent in the future we need will be + past participle.\nThe suspect ____ by the police when he tried to leave the country.|was arrested|arrested;has arrested;was arresting|Past simple passive.\nThis room ____ since last week.|has not been used|is not used;did not use;has not used|Present perfect passive: has/have been + past participle.\nThe house ____ when we arrived.|was being painted|was painting;painted;had paint|Past continuous passive: was/were being + past participle.\nHundreds of jobs ____ if the factory closes.|will be lost|will lose;are lost;lost|Future passive after a first conditional.\nShe ____ a prize for her research last year.|was given|gave;has given;was gave|Give has two objects, so either can become the subject.\nThe documents must ____ before Monday.|be signed|sign;be signing;been signed|Modal passive: modal + be + past participle.\nThe cake ____ by the time we arrived.|had been eaten|was eaten;had eaten;has been eaten|Past perfect passive: had been + past participle.\nI don't like ____ what to do.|being told|telling;to tell;told|After like we use the -ing form; the passive is being + past participle.\nThe painting is believed ____ stolen in 1990.|to have been|to be;to have;being|Passive reporting with a past event: to have been + past participle.");
addGram("cond", "Conditionals", 205, "Zero, first, second, third and mixed conditionals, plus unless and as long as.", "If you heat ice, it ____.|melts|will melt;would melt;melted|Zero conditional: general truths use present simple + present simple.\nIf it rains tomorrow, we ____ at home.|will stay|would stay;stayed;had stayed|First conditional: present simple + will for real future possibilities.\nIf I ____ you, I would apologise.|were|am;would be;had been|Second conditional advice: If I were you, I would...\nIf she had studied harder, she ____ the exam.|would have passed|would pass;will pass;had passed|Third conditional: past perfect + would have + past participle.\nI'll call you as soon as I ____ home.|get|will get;would get;got|After as soon as we use the present simple for the future.\nIf I won the lottery, I ____ round the world.|would travel|will travel;travelled;would have travelled|Second conditional: past simple + would + infinitive.\nYou will miss the bus ____ you hurry up.|unless|if;in case;as long as|Unless means if not: you will miss it if you don't hurry.\nYou can borrow my car ____ you drive carefully.|as long as|unless;in case;otherwise|As long as means only if.\nTake an umbrella ____ it rains.|in case|unless;as long as;providing|In case is used for precautions: you take it just to be safe.\nIf I ____ known about the problem, I would have helped.|had|have;would have;knew|Third conditional: if + past perfect.\nIf he were more careful, he ____ so many accidents.|wouldn't have|won't have;hadn't;didn't have|Second conditional: were + would + infinitive.\nIf I hadn't missed the bus, I ____ late for work now.|wouldn't be|won't be;wouldn't have been;am not|Mixed conditional: a past cause and a present result.\nWhat ____ if there was a fire?|would you do|will you do;did you do;would you have done|Second conditional question: what would you do?\nIf you ____ any problems, call me.|have|will have;would have;had|First conditional: present simple in the if-clause.\nI wouldn't be so tired if I ____ to bed earlier last night.|had gone|went;would go;have gone|Mixed conditional: past perfect in the if-clause.\nIf it ____ for his help, we would have lost.|hadn't been|wasn't;weren't;wouldn't be|If it hadn't been for = without (a past situation).");
addGram("report", "Reported speech", 330, "Backshift, reported questions, commands and reporting verbs.", "She said, \"I am tired.\" She said that she ____ tired.|was|is;were;had be|Present simple moves back to past simple in reported speech.\nHe said, \"I will call you.\" He said he ____ me.|would call|will call;calls;is calling|Will becomes would in reported speech.\n\"What time is it?\" He asked me what time ____.|it was|was it;is it;it is|Reported questions keep statement word order: it was, not was it.\n\"Do you like pizza?\" She asked me ____ I liked pizza.|if|that;what;do|Yes/no questions are reported with if or whether.\n\"Don't touch it!\" He told me ____ it.|not to touch|don't touch;not touch;to not touching|Negative commands: told + object + not to + infinitive.\n\"Open the window,\" she said. She told me ____ the window.|to open|open;opening;that I open|Commands: told + object + to + infinitive.\n\"I have finished,\" he said. He said he ____ finished.|had|has;have;was|Present perfect becomes past perfect.\n\"I saw her yesterday.\" He said he had seen her ____.|the day before|yesterday;the day after;tomorrow|Yesterday becomes the day before in reported speech.\nHe asked me ____ I could help him.|whether|that;what;do|Whether is used for indirect yes/no questions.\n\"You should see a doctor,\" he said. He advised me ____ a doctor.|to see|seeing;see;that see|Advise + object + to + infinitive.\nHe said, \"I've never been to Rome.\" He said he ____ been to Rome.|had never|has never;never has;never had been|Present perfect backshifts to past perfect.\n\"I'm working here.\" She said she ____ there.|was working|is working;works;has worked|Present continuous becomes past continuous.\n\"Why are you late?\" The teacher asked me why I ____ late.|was|am;is;were|Reported question: statement order and backshift.\nHe ____ me that the shop was closed.|told|said;spoke;asked|Tell needs a person object; say does not.\nShe ____ that she was tired.|said|told;asked;spoke|Say is used without a person object.\n\"I'm sorry I'm late,\" she said. She apologised ____ late.|for being|to be;of being;that being|Apologise for + -ing form.");
addGram("rel", "Relative clauses", 100, "Who, which, that, whose, where, when and why.", "The woman ____ lives next door is a doctor.|who|which;whose;whom|Who refers to people as the subject of the clause.\nThe book ____ I bought yesterday is excellent.|that|who;whose;where|That can introduce a defining clause about things.\nThat's the man ____ car was stolen.|whose|who;which;whom|Whose shows possession: the man's car.\nThis is the town ____ I was born.|where|which;when;that|Where refers to a place.\nMy sister, ____ lives in Paris, is a pilot.|who|that;which;whose|In non-defining clauses (with commas) we cannot use that.\nThe film, ____ was released last month, was a hit.|which|that;who;whose|Non-defining clause about a thing: which, never that.\nI'll never forget the day ____ we met.|when|where;which;what|When refers to a time.\nThe reason ____ he left is a mystery.|why|which;who;whose|Why follows the word reason.\nThe girl to ____ I spoke was very polite.|whom|who;which;whose|After a preposition we use whom for people.\nEverything ____ he said was true.|that|what;which;who|After everything, all, nothing we use that.\nHe told me about his trip, ____ was very interesting.|which|what;that;who|Which can refer to the whole previous clause.\nThe students ____ passed the exam were happy.|who|whose;which;whom|Who for people as the subject.\nThe house ____ roof was damaged has been repaired.|whose|which;who;that|Whose can also refer to things.\nThat's the cafe in ____ we first met.|which|that;where;whom|After a preposition we use which for things.\nDo you know the name of the person ____ left this bag?|who|whose;which;whom|Who is the subject of left.\nThere is nothing ____ I can do.|that|what;whom;whose|After nothing we use that, not what.");
addGram("verb", "Gerund or infinitive", 50, "Which verbs take -ing and which take to + infinitive.", "I enjoy ____ to music in the evening.|listening|to listen;listen;listened|Enjoy is followed by the -ing form.\nShe decided ____ a new job.|to look for|looking for;look for;to looking for|Decide + to + infinitive.\nHe avoided ____ the question.|answering|to answer;answer;answered|Avoid + -ing.\nI'm looking forward to ____ you.|seeing|see;to see;saw|After look forward to, to is a preposition, so use -ing.\nThey agreed ____ the project next week.|to start|starting;start;to starting|Agree + to + infinitive.\nI remember ____ the door; I'm sure I locked it.|locking|to lock;lock;locked|Remember + -ing: a memory of a past action.\nRemember ____ the door before you leave.|to lock|locking;lock;locked|Remember + to + infinitive: a task you must not forget.\nYou should stop ____ so much junk food.|eating|to eat;eat;ate|Stop + -ing means to quit an action.\nHe suggested ____ to the cinema.|going|to go;go;went|Suggest + -ing.\nI can't afford ____ a new phone.|to buy|buying;buy;bought|Afford + to + infinitive.\nShe made me ____ the room.|clean|to clean;cleaning;cleaned|Make + object + bare infinitive.\nMy parents let me ____ out late on Saturdays.|stay|to stay;staying;stayed|Let + object + bare infinitive.\nI'm trying ____ my English, so I watch films every day.|to improve|improving;improve;improved|Try + to + infinitive: make an effort.\nIt's worth ____ the museum if you have time.|visiting|to visit;visit;visited|Worth is followed by the -ing form.\nShe admitted ____ the money.|taking|to take;take;took|Admit + -ing.\nI'd like ____ you something.|to show|showing;show;shown|Would like + to + infinitive.");
addGram("modal", "Modal verbs", 240, "Deduction, obligation, permission and criticism about the past.", "He ____ be at home; his car is outside.|must|can't;mustn't;needn't|Must expresses a strong deduction: you are almost sure.\nShe ____ be 60; she looks so young!|can't|must;mustn't;needn't|Can't expresses a strong negative deduction.\nThey ____ have left already; the lights are off.|must|can;would;need|Must have + past participle: a strong deduction about the past.\nYou ____ have told me earlier! Now it's too late.|should|must;can;needn't|Should have + past participle criticises a past action.\nYou ____ wear a seat belt. It's the law.|must|needn't;mustn't;may|Must expresses strong obligation.\nYou ____ park here; it's forbidden.|mustn't|needn't;don't have to;can|Mustn't means it is prohibited.\nYou ____ bring anything; we have everything.|don't have to|mustn't;can't;shouldn't|Don't have to means it is not necessary.\nI ____ speak French when I was five.|could|can;might;should|Could expresses ability in the past.\nIt ____ rain later, so take an umbrella.|might|must;can't;should have|Might expresses a possibility.\n____ you help me with these bags, please?|Could|Must;Should;Need|Could is a polite way to make a request.\nHe ____ have missed the train; he's always on time.|can't|mustn't;shouldn't;needn't|Can't have + past participle: a negative deduction about the past.\nWe ____ have taken a taxi; the bus was perfectly fine.|needn't|mustn't;can't;might not|Needn't have + past participle: it was unnecessary, but we did it.\nYou ____ see a doctor if the pain continues.|should|might;must have;needn't|Should is used for advice.\n____ I borrow your pen?|May|Must;Would;Should|May I is a formal way to ask for permission.\nShe ____ be in the library; I saw her go in.|must|can't;shouldn't;needn't|Must: she is almost certainly there.\nI'm sorry, I ____ have shouted at you.|shouldn't|mustn't;can't;needn't|Shouldn't have + past participle expresses regret.");
addGram("tense", "Past simple, perfect and continuous", 175, "Choose between past simple, present perfect, past perfect and the continuous forms.", "I ____ here since 2019.|have lived|lived;live;am living|Since + a date needs the present perfect.\nShe ____ to Paris last summer.|went|has gone;goes;was going|A finished time (last summer) needs the past simple.\nWhen I arrived, the film ____ already started.|had|has;was;did|Past perfect: the film started before I arrived.\nI ____ TV when the phone rang.|was watching|watched;have watched;had watched|Past continuous: an action in progress interrupted by another.\nHow long ____ you been learning English?|have|did;had;do|Present perfect continuous: how long + have you been + -ing.\nHe has worked here ____ ten years.|for|since;during;from|For + a period of time.\nShe has been living here ____ 2015.|since|for;from;during|Since + a point in time.\nI ____ my keys. Can you help me look for them?|have lost|lost;had lost;was losing|Present perfect: a past action with a result now.\nBy the time we got there, they ____ everything.|had eaten|ate;have eaten;were eating|Past perfect: the eating finished before we arrived.\nI ____ him yesterday.|saw|have seen;had seen;see|Yesterday is a finished time, so we use the past simple.\nWe ____ for two hours when the bus finally came.|had been waiting|have been waiting;were waiting;waited|Past perfect continuous: how long before a past moment.\nLook! It ____ snowing.|has started|started;had started;was starting|Present perfect: a recent action with a visible result.\nI've just ____ the report.|finished|finish;finishing;finishes|Have + just + past participle.\nBy the time she moved to Spain, she ____ in London for five years.|had lived|lived;has lived;was living|Past perfect: before another moment in the past.\nI ____ to the gym three times this week.|have been|was;had been;am going|This week is not finished, so we use the present perfect.\nWhen I was young, we ____ to the seaside every summer.|went|have gone;had gone;go|A repeated past habit in a finished period: past simple.");
addGram("link", "Linking words", 355, "Although, despite, however, so that, whereas and more.", "____ it was raining, we went for a walk.|Although|Despite;However;Because of|Although is followed by a clause (subject + verb).\n____ the rain, we went for a walk.|Despite|Although;However;Even though|Despite is followed by a noun or an -ing form.\nI was tired. ____, I kept working.|However|Although;Despite;Because|However starts a new sentence and shows contrast.\nHe didn't go out ____ he was ill.|because|because of;despite;although|Because is followed by a clause.\nHe stayed at home ____ the weather.|because of|because;although;however|Because of is followed by a noun.\nShe works hard ____ she can buy a house.|so that|in spite of;however;although|So that introduces a purpose.\nI like tea, ____ my brother prefers coffee.|whereas|despite;unless;as|Whereas compares two different things.\n____ being tired, he finished the race.|In spite of|Although;However;Even though|In spite of + -ing form.\nHe worked hard; ____, he failed the exam.|nevertheless|because;so that;in case|Nevertheless means in spite of that.\nI'll lend you the book ____ you promise to return it.|provided that|unless;although;in spite of|Provided that means only if.\nShe didn't pass the exam. ____, she wasn't disappointed.|Even so|Because;Unless;So that|Even so adds a surprising contrast.\nShe left early ____ she could catch the last train.|so that|despite;however;although|So that + a clause expresses purpose.\nI enjoyed the trip. ____, the hotel was a bit noisy.|On the other hand|Because of;Unless;In case|On the other hand introduces a contrasting point.\n____ he is very rich, he is not happy.|Even though|Despite;However;In spite|Even though is followed by a full clause.\nWe stayed inside ____ it was freezing.|as|despite;however;whereas|As can mean because.\nFirstly, we need money. ____, we need time.|Moreover|Although;Unless;Whereas|Moreover adds another point to the first one.");
addGram("prefer", "Would rather, had better, it's time", 125, "Preferences, advice and urgency structures.", "I'd rather ____ at home tonight.|stay|to stay;staying;stayed|Would rather + base form of the verb.\nYou'd better ____ a coat; it's cold.|take|to take;taking;took|Had better + base form of the verb.\nIt's time we ____ home.|went|go;to go;going|It's time + past simple: the action should already be happening.\nI'd rather you ____ smoke in here.|didn't|don't;wouldn't;haven't|Would rather + a different subject takes the past simple.\nI'd prefer ____ by train.|to travel|travel;travelling to;travelled|Would prefer + to + infinitive.\nI prefer walking ____ driving.|to|than;from;at|Prefer + -ing + to + -ing.\nShe'd rather ____ than eat meat.|starve|to starve;starving;starved|Would rather + base form, with than + base form.\nYou had better ____ late again.|not be|not to be;don't be;aren't|The negative of had better is had better not + base form.\nIt's high time you ____ a job.|found|find;will find;finding|It's high time + past simple.\nI'd rather you ____ me the truth yesterday.|had told|told;tell;would tell|Would rather + past perfect: a regret about the past.\nWould you rather ____ tea or coffee?|have|to have;having;had|Would you rather + base form.\nWe'd better ____ now, or we'll miss the bus.|leave|to leave;leaving;left|Had better + base form, without to.\nHe'd rather ____ a taxi than walk home.|take|to take;taking;took|Would rather + base form.\nI'd prefer you ____ the window open.|to leave|leave;leaving;left|Would prefer + object + to + infinitive.\nShe prefers ____ to the radio rather than watch TV.|to listen|listening;listen;listened|Prefer + to + infinitive before rather than + base form.\nIt's about time you ____ to bed.|went|go;going;to go|It's about time + past simple.");
addGram("caus", "Have or get something done", 70, "Things other people do for you.", "I ____ my hair cut yesterday.|had|did;made;was|Have + object + past participle: someone else did it for me.\nWe're going to ____ the house painted next week.|have|make;do;be|Have + something + past participle.\nShe ____ her car repaired last week.|had|has;did;made|Past simple of have something done.\nI must get my passport ____.|renewed|renew;renewing;to renew|Get + object + past participle.\nHe had his phone ____ yesterday.|stolen|steal;stealing;stole|Have + object + past participle, also for bad experiences.\nWe ____ a new kitchen fitted last month.|had|made;did;were|Had + object + past participle.\nI need to ____ my eyes tested.|have|do;make;take|Have your eyes tested: an optician does it.\nShe got her teeth ____ at the dentist.|checked|check;checking;to check|Get + object + past participle.\nDid you ____ your flat cleaned?|have|make;do;let|Questions use did + have + object + past participle.\nI'm having my hair ____ tomorrow.|cut|cutting;cuts;to cut|The past participle shows someone cuts it for you.\nThey ____ the roof fixed after the storm.|had|have;made;let|The past simple had shows a finished event.\nWe had our photo ____ in the park.|taken|take;taking;took|Had + object + past participle.\nI'll have someone ____ the TV.|repair|repaired;repairing;to repair|Have + person + base form is the active version.\nWhy don't you ____ your hair dyed?|get|do;make;take|Get can replace have in informal speech.");
addGram("comp", "Comparatives and superlatives", 260, "As...as, the more...the more, much better and by far the best.", "This exam was ____ than the last one.|easier|more easy;most easy;easy|Short adjectives add -er; easy becomes easier.\nShe is ____ student in the class.|the best|the better;best;better|The superlative of good is the best.\nHe isn't ____ tall as his brother.|as|than;more;like|Not as + adjective + as compares two equals.\nThe more you practise, ____ you become.|the better|better;the best;the good|The + comparative, the + comparative.\nThis phone is ____ more expensive than mine.|much|very;most;too|Much (not very) intensifies a comparative.\nIt's getting ____ every day.|colder and colder|more cold;coldest;the colder|Repeating the comparative shows gradual change.\nShe speaks English ____ than I do.|more fluently|more fluent;fluentlier;most fluently|Adverbs of this type use more + adverb.\nThat was by far ____ film I've ever seen.|the worst|the worse;worst;worse|By far goes with the superlative: the worst.\nThe weather is not ____ as it was yesterday.|as good|so better;good as;better|Not as + adjective + as.\nHe works ____ than anyone else in the office.|harder|more hard;hardest;the harder|Hard is both adjective and adverb; its comparative is harder.\nSpain is ____ to the Equator than Norway.|closer|closest;more close;the closer|Short adjectives add -er: close becomes closer.\nThis is ____ interesting book I have read this year.|the most|most;more;the more|The + most + adjective for the superlative of long adjectives.\nShe's twice ____ old as her brother.|as|than;so;more|Twice as + adjective + as.\nMy flat is quite ____ from yours.|different|more different;differently;difference|After quite we use the adjective; different takes from.\nThe earlier we leave, ____ we'll arrive.|the sooner|sooner;the soon;soonest|The + comparative, the + comparative.\nI feel ____ today than yesterday.|much better|very better;most good;more good|Better is the comparative of good; much strengthens it.");
addGram("coll", "Collocations", 300, "Make, do, take, have, keep, save and other natural word partners.", "I need to ____ a decision before Friday.|make|do;have;get|We make decisions, plans, mistakes and money.\nCould you ____ me a favour?|do|make;take;give|We do a favour, homework, the dishes and our best.\nWe should ____ a break; we've been working for hours.|take|make;do;give|Take a break, a photo, a seat or a risk.\nThey ____ a lovely time in Rome.|had|made;did;took|Have a good time, a look, a meeting or a chat.\nI'll ____ my best to arrive on time.|do|make;take;have|The fixed expression is do your best.\nHe promised to ____ the dishes after dinner.|do|make;take;have|Do the dishes, the washing, the shopping.\nPlease ____ attention to what I'm saying.|pay|make;do;take|The collocation is pay attention.\nShe ____ a mistake on the form.|made|did;took;had|We make a mistake.\nI'd like to ____ a complaint about the service.|make|do;take;get|Make a complaint, an effort, a suggestion.\nLet's ____ a look at the menu.|have|make;do;give|Have a look, a shower, a rest.\nWe need to ____ a meeting to discuss the problem.|have|do;take;give|Have a meeting, a party, a conversation.\nIt doesn't ____ any difference to me.|make|do;have;give|Make a difference.\nYou should ____ advantage of this special offer.|take|make;do;get|Take advantage of something.\nThere was ____ traffic this morning, so I was late.|heavy|strong;big;thick|Traffic and rain are heavy, not strong.\nI'd like a cup of ____ coffee, please.|strong|heavy;hard;powerful|Coffee, tea and wind are strong.\nShe has a ____ chance of winning, so she's very nervous.|slim|thin;narrow;skinny|A slim chance means a very small chance.\nHe took a deep ____ before answering.|breath|air;wind;gasp|Take a deep breath.\nI promised not to tell anyone, and I always ____ a secret.|keep|hold;make;do|Keep a secret, a promise, a diary.\nWe must ____ the deadline, or the client will be angry.|meet|catch;reach;do|Meet a deadline, a target or a requirement.\nShe ____ a small business in the town centre.|runs|drives;does;makes|Run a business, a shop or a company.\nDon't ____ a lie; tell me the truth.|tell|say;make;speak|Tell a lie, a joke, a story or the truth.\nIf you take the motorway, you will ____ time.|save|win;keep;earn|Save time, money or energy.\nTry not to ____ your temper when the children shout.|lose|miss;waste;drop|Lose your temper, your way or your job.\nHe was fined for ____ the speed limit.|breaking|making;doing;taking|Break the law, a rule, the speed limit or a promise.");
addGram("art", "Articles and quantifiers", 225, "A, an, the, no article, much, many, few, little, some and any.", "I saw ____ interesting film last night.|an|a;the;–|Use an before a vowel sound.\nShe is ____ doctor.|a|an;the;–|Use a/an with jobs.\n____ sun rises in the east.|The|A;An;–|Unique things take the.\nI love ____ music.|–|a;the;an|No article for general ideas and plural or uncountable nouns.\nHe plays ____ guitar very well.|the|a;an;–|Musical instruments take the.\nWe had dinner at ____ restaurant you recommended.|the|a;an;–|The refers to a specific one both people know.\nHe went to ____ bed at ten.|–|the;a;an|Fixed expressions: go to bed, go to school, go home.\nIt was ____ one-hour trip.|a|an;the;–|One starts with a consonant sound, so we use a.\nWhat ____ beautiful day!|a|the;an;–|Exclamations with what + a singular noun need a/an.\nWe stayed in ____ Hilton Hotel.|the|a;an;–|Hotels and restaurants with proper names often take the.\nThere isn't ____ milk left.|much|many;a few;few|Much is used with uncountable nouns in negatives.\nHow ____ people came to the party?|many|much;a little;little|Many goes with countable plural nouns.\nI have ____ friends here, so I feel a bit lonely.|few|little;a few;much|Few means almost none, with a negative feeling.\nWe have ____ time left; let's hurry.|little|few;a few;many|Little means not much, with uncountable nouns.\nCould I have ____ water, please?|some|any;many;few|Some is used in offers and requests.\nDo you have ____ questions?|any|some;much;a little|Any is used in questions.\nThere were ____ people at the concert; the hall was full.|a lot of|much;a little;any|A lot of works with countable and uncountable nouns.\nI need ____ advice.|some|a;many;few|Advice is uncountable, so we cannot say an advice.\n____ of the students passed the exam, so the teacher was pleased.|Most|Much;Little;Any|Most of + plural noun means nearly all.\nHe has ____ money; he can't even pay the rent.|hardly any|hardly no;a few;many|Hardly any means almost none.\nI have read ____ books by this author, but not all.|some|much;a little;any|Some is used in positive statements.\n____ student has to bring a passport.|Every|All;Much;Many|Every is followed by a singular noun.");

function buildCards(el, dict, kind){
  Object.keys(dict).forEach(function(k){
    var d = dict[k];
    var card = document.createElement("div");
    card.className = "skill";
    card.style.setProperty("--h", d.h);
    var h = "<h3>" + d.name + "</h3><p>" + d.blurb + "</p><span class='count'>" + d.items.length + " items</span><div class='modes'>";
    if (d.pairs) h += "<button class='mini' data-g='" + kind + "' data-k='" + k + "' data-m='pairs'>Pairs</button>";
    h += "<button class='mini' data-g='" + kind + "' data-k='" + k + "' data-m='quiz'>" + d.rushName + "</button></div>";
    card.innerHTML = h;
    el.appendChild(card);
  });
  el.addEventListener("click", function(e){
    var b = e.target.closest(".mini");
    if (!b) return;
    if (b.dataset.m === "pairs") startSkillPairs(b.dataset.k); else startQuiz(b.dataset.g, b.dataset.k);
  });
}
buildCards($("#skills"), SKILLS, "sk");
buildCards($("#grammar"), GRAMMAR, "gr");

var sect = "units";
function renderSect(){
  var ids = {units:"Units", skills:"Skills", gram:"Gram"};
  Object.keys(ids).forEach(function(k){
    $("#tab" + ids[k]).setAttribute("aria-pressed", sect === k);
    $("#p" + ids[k]).hidden = sect !== k;
  });
}
$("#tabUnits").addEventListener("click", function(){ sect = "units"; renderSect(); });
$("#tabSkills").addEventListener("click", function(){ sect = "skills"; renderSect(); });
$("#tabGram").addEventListener("click", function(){ sect = "gram"; renderSect(); });

function startSkillPairs(k){
  var d = SKILLS[k];
  start([{n:k, t:d.name, label:d.name + " · Pairs", words:d.items.map(function(q){
    return {en:q.en, es:q.es, s:q.s.replace("____", q.a), h:q.a};
  })}]);
}

/* ----- Gap Fill / Idiom Detective: 10 questions, no timer, a Next button after each answer ----- */
var Q = null;
var PREPS = ["in","on","at","of","for","to","with","from","about","by"];

function startQuiz(kind, key){
  var d = (kind === "gr" ? GRAMMAR : SKILLS)[key];
  var sk = (kind === "gr" ? "g-" : "r-") + key;
  var seen = seenByPool[sk] || (seenByPool[sk] = {});
  var unseen = d.items.filter(function(q){ return !seen[q.id]; });
  if (!unseen.length){ seen = seenByPool[sk] = {}; unseen = d.items.slice(); }
  var order = shuffle(unseen);
  if (order.length < QN) order = order.concat(shuffle(d.items.filter(function(q){ return order.indexOf(q) < 0; })));
  Q = {kind:kind, key:key, d:d, order:order.slice(0, QN), i:-1, right:0, done:0, streak:0, best:0, log:[], seen:seen, lock:false, cur:null, over:false};
  $("#rTitle").textContent = d.rushName + " · " + d.name;
  $("#rHint").textContent = d.hint + " Take your time: there is no timer.";
  show("rush");
  nextQ();
}
function updateQuiz(){
  var n = Q.order.length;
  $("#rTime").textContent = Math.min(Q.done + 1, n) + "/" + n;
  $("#rScore").textContent = "✓ " + Q.right;
  $("#rFill").style.width = (Q.done / n * 100) + "%";
}
function makeOptions(q, key){
  if (q.o) return shuffle([q.a].concat(q.o));
  var pool;
  if (key === "pp") pool = PREPS.filter(function(p){ return p !== q.a; });
  else pool = SKILLS[key].items.map(function(x){ return x.a; }).filter(function(a){ return a !== q.a; });
  pool = shuffle(pool);
  var picks = [];
  if (key === "pv"){
    var base = q.a.split(" ")[0];
    var same = pool.filter(function(p){ return p.split(" ")[0] === base; });
    if (same.length) picks.push(same[0]);
  }
  pool.forEach(function(p){ if (picks.length < 3 && picks.indexOf(p) < 0) picks.push(p); });
  return shuffle(picks.concat(q.a));
}
function nextQ(){
  if (!Q || Q.over) return;
  Q.i++;
  if (Q.i >= Q.order.length){ endQuiz(); return; }
  var q = Q.order[Q.i];
  Q.cur = q; Q.lock = false;
  var p = $("#rQ");
  p.innerHTML = "";
  var parts = q.s.split("____");
  p.appendChild(document.createTextNode(parts[0]));
  var gap = document.createElement("span");
  gap.className = "gap"; gap.id = "rGap"; gap.innerHTML = "&nbsp;";
  p.appendChild(gap);
  p.appendChild(document.createTextNode(parts[1] || ""));
  var box = $("#rOpts");
  box.innerHTML = "";
  makeOptions(q, Q.key).forEach(function(o){
    var b = document.createElement("button");
    b.className = "opt"; b.textContent = o;
    b.addEventListener("click", function(){ answer(b, o); });
    box.appendChild(b);
  });
  $("#rFb").textContent = "";
  $("#rNext").hidden = true;
  updateQuiz();
}
function answer(btn, val){
  if (Q.lock) return;
  Q.lock = true;
  var q = Q.cur, ok = (val === q.a);
  Q.done++;
  Q.seen[q.id] = true; saveSeen();
  var gap = $("#rGap");
  gap.textContent = q.a;
  gap.classList.add(ok ? "good" : "bad");
  Array.prototype.forEach.call($("#rOpts").children, function(b){
    b.disabled = true;
    if (b.textContent === q.a) b.classList.add("ok");
    else if (b === btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  if (ok){ Q.right++; Q.streak++; Q.best = Math.max(Q.best, Q.streak); } else Q.streak = 0;
  Q.log.push({q:q, ok:ok, picked:val});
  var gloss = q.why ? esc(q.why) : (q.es ? "<b>" + esc(q.a) + "</b> = " + esc(q.es) : "");
  $("#rFb").innerHTML = (ok ? "Correct" + (Q.streak >= 3 ? " &middot; streak " + Q.streak : "") : "Not this time") + (gloss ? "<br>" + gloss : "");
  var nb = $("#rNext");
  nb.textContent = (Q.i + 1 >= Q.order.length) ? "See recap" : "Next";
  nb.hidden = false;
  try { nb.focus({preventScroll:true}); } catch(e){}
  updateQuiz();
}
function endQuiz(){
  if (!Q || Q.over) return;
  Q.over = true;
  var n = Q.done, acc = n ? Q.right / n : 0;
  var title, sub;
  if (n >= 8 && acc >= 0.9){ title = "Very solid."; sub = "Almost everything right. Read the recap once more and move on."; }
  else if (acc >= 0.7){ title = "Good round."; sub = "Most answers landed. The recap shows the ones to review."; }
  else { title = "Keep going."; sub = "Read the recap carefully. Seeing each one in a sentence helps it stick."; }
  var rows = Q.log.map(function(e){
    var q = e.q, note = "";
    if (q.why) note = q.why;
    if (!e.ok) note = "You chose: " + e.picked + (note ? ". " + note : "");
    var r = {ok:e.ok, s:q.s.replace("____", q.a), hl:q.a, note:note};
    if (q.es){ r.t = q.a; r.sub = q.es; }
    return r;
  });
  var kind = Q.kind, key = Q.key;
  showEnd(title, sub, [[Q.right + "/" + n, "Correct"], [Q.best, "Best streak"], [Math.round(acc * 100) + "%", "Accuracy"]],
    "Play again", function(){ startQuiz(kind, key); }, "Recap", rows);
  if (n >= 8 && acc >= 0.7) confetti();
}
$("#rNext").addEventListener("click", nextQ);
$("#rBack").addEventListener("click", function(){
  if (Q) Q.over = true;
  show("home");
});
document.addEventListener("keydown", function(e){
  if (!Q || screens.rush.hidden || Q.lock) return;
  var n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4){ var b = $("#rOpts").children[n - 1]; if (b) b.click(); }
});

renderHome();
renderSect();
</script>
